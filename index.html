<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWC Real CMR Layout</title>
<style>
body{margin:0;background:#f2f2f2;font-family:Arial}
header{background:#fff;padding:16px;border-bottom:1px solid #ddd}
main{max-width:1200px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;border:1px solid #ddd}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}
textarea{min-height:70px}
button{padding:12px 14px;border:0;border-radius:10px;font-weight:bold;background:#111;color:#fff}
.orange{background:#f58220}
.green{background:#198754}
.preview img{width:100%;border:1px solid #ddd;border-radius:8px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>📄 Virtuele CMR — Real Layout</h1>
<p>Gebaseerd op een echte CMR layout zoals jouw voorbeeld.</p>
</header>

<main>

<div class="card">
<h2>CMR invullen</h2>

<div class="grid">
<div><label>CMR nummer</label><input id="cmr"></div>
<div><label>Datum</label><input type="date" id="datum"></div>
<div><label>Aantal kopieën</label>
<select id="copies">
<option>1</option>
<option>2</option>
<option>3</option>
<option selected>4</option>
</select>
</div>
</div>

<div class="grid">
<div><label>1 Afzender</label><textarea></textarea></div>
<div><label>2 Geadresseerde</label><textarea></textarea></div>
<div><label>16 Vervoerder</label><textarea></textarea></div>
</div>

<div class="grid">
<div><label>3 Plaats aflevering</label><input></div>
<div><label>4 Plaats/datum ontvangst</label><input></div>
<div><label>Kenteken</label><input></div>
</div>

<div class="grid">
<div><label>5 Bijgevoegde documenten</label><textarea></textarea></div>
<div><label>6 Aantal colli</label><input type="number"></div>
<div><label>11 Gewicht</label><input type="number"></div>
</div>

<label>9 Omschrijving goederen</label>
<textarea style="min-height:120px"></textarea>

<div class="grid">
<div><label>13 Instructies afzender</label><textarea></textarea></div>
<div><label>19 Speciale overeenkomsten</label><textarea></textarea></div>
<div><label>24 Ontvangen goederen</label><textarea></textarea></div>
</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
<button class="orange" onclick="window.print()">🖨️ Print CMR</button>
<button class="green">📄 PDF</button>
<button>💾 Opslaan</button>
</div>
</div>

<div class="card preview">
<h2>Voorbeeld layout</h2>
<p>De uiteindelijke print/PDF wordt op deze echte CMR layout gebaseerd.</p>
<img src="1778782033890.jpeg">
</div>

</main>
</body>
</html>

<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWC Operations App V2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--o:#f58220;--d:#111827;--l:#e5e7eb;--b:#f6f7f9;--m:#6b7280;--g:#198754;--r:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:Arial,Helvetica,sans-serif;color:var(--d)}header{background:#fff;border-bottom:1px solid var(--l);padding:16px;position:sticky;top:0;z-index:10}h1{font-size:20px;margin:0}main{max-width:1180px;margin:auto;padding:14px}.top{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}button{border:0;border-radius:12px;background:#111;color:#fff;font-weight:900;padding:10px 13px}.nav button{background:#fff;color:#111;border:1px solid var(--l);text-align:left}.nav button.active{background:var(--o);color:#fff}.muted{color:var(--m);font-size:13px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.04)}.tab{display:none}.tab.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:13px;font-weight:900;display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--l);border-radius:12px;padding:10px;font-size:15px}textarea{min-height:84px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:var(--o)}.green{background:var(--g)}.red{background:var(--r)}.light{background:#f3f4f6;color:#111;border:1px solid var(--l)}.item{border:1px solid var(--l);border-radius:14px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:8px;background:#fff}.preview{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--l);border-radius:14px;padding:12px;font-family:monospace;font-size:13px;max-height:330px;overflow:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{border:1px solid var(--l);border-radius:16px;padding:12px;text-align:center}.stat b{font-size:26px;color:var(--o);display:block}@media(max-width:760px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}}
</style></head><body>
<header><h1>🚀 AWC Operations App V2 Prototype</h1><p class="muted">Tweede app: bestaande AWC-modules + extra warehouse operations modules.</p><div class="top"><input id="q" placeholder="Zoek module..." oninput="renderNav()"><button class="light" onclick="show('dashboard')">Dashboard</button><button class="red" onclick="clearAllData()">Alle testdata wissen</button></div></header>
<main><div id="nav" class="nav"></div><div id="tabs"></div></main>
<script>
const modules=[{"id": "dashboard", "icon": "🏠", "title": "Dashboard", "desc": "Totaaloverzicht van alle modules", "fields": []}, {"id": "warehouse", "icon": "🏭", "title": "Warehouse checks", "desc": "Controle per ruimte/afdeling", "fields": [["Datum", "date"], ["Controleur", "text"], ["Ruimte", "Hallen|Expeditie|Buitenterrein|Entresol|Toiletten|Kantine|Overig"], ["Controlepunt", "Orde/netheid|Veiligheid|Blokkades|Schade|Materieel|Schoonmaak|Overig"], ["Status", "OK|Actie nodig|Niet akkoord"], ["Opmerking", "textarea"]]}, {"id": "personnel", "icon": "👥", "title": "Personeelscontrole", "desc": "Aanwezigheid, afwezigheid en werkplekplanning", "fields": [["Datum", "date"], ["Medewerker", "text"], ["Status", "Aanwezig|Afwezig|Ziek|Verlof|Te laat|Niet ingeroosterd"], ["Werkplek / afdeling", "Laden|Lossen|Picking|Packing|Controle|Warehouse|BHV|Buitenterrein|Expeditie|Teamlead Inbound|Teamlead Outbound|Warehousemanager|Overig"], ["Opmerking", "textarea"]], "filters": ["Volledige lijst", "Alleen afwezigen", "Planning / werkplekoverzicht"]}, {"id": "bhv", "icon": "🧯", "title": "BHV / noodlijst", "desc": "BHV bezetting, noodlijst en verzamelplaatscheck", "fields": [["Datum", "date"], ["BHV aanwezig", "Ja|Nee"], ["BHV naam", "text"], ["Aantal aanwezigen", "number"], ["Verzamelplaats check", "Akkoord|Niet akkoord|N.v.t."], ["Incident", "Geen|EHBO|Brand|Ontruiming|Anders"], ["Opmerking", "textarea"]]}, {"id": "open_shipments", "icon": "📦", "title": "Openstaande zendingen", "desc": "Barcode, klant, referentie, status en locatie", "fields": [["Zendingnummer", "text"], ["Klant", "text"], ["Referentie", "text"], ["Vervoerder", "text"], ["Status", "Op vloer|Wacht op klant|Gereed|Probleem|Geladen"], ["Locatie", "text"], ["Labeltekst / OCR", "textarea"], ["Opmerking", "textarea"]]}, {"id": "dock", "icon": "🚪", "title": "Dockplanning", "desc": "Dock bezetting en laad/losplanning", "fields": [["Datum", "date"], ["Dock", "text"], ["Tijd", "time"], ["Vervoerder", "text"], ["Klant", "text"], ["Type", "Laden|Lossen|Wachten|Gereed"], ["Status", "Gepland|Bezig|Gereed|Probleem"], ["Opmerking", "textarea"]]}, {"id": "inbound", "icon": "📥", "title": "Inbound controle", "desc": "Binnenkomstcontrole, schade, seal en manco", "fields": [["Datum", "date"], ["Leverancier / klant", "text"], ["Order / ASN", "text"], ["Vervoerder", "text"], ["Seal controle", "Akkoord|Afwijking|N.v.t."], ["Colli verwacht", "number"], ["Colli ontvangen", "number"], ["Status", "Akkoord|Schade|Manco|Controle nodig"], ["Opmerking", "textarea"]]}, {"id": "outbound", "icon": "📤", "title": "Outbound eindcontrole", "desc": "Controle vóór verzending", "fields": [["Datum", "date"], ["Klant", "text"], ["Ordernummer", "text"], ["Vervoerder", "text"], ["Aantal pallets/colli", "number"], ["Documenten aanwezig", "Ja|Nee|N.v.t."], ["Status", "Akkoord|Niet akkoord|Controle nodig"], ["Opmerking", "textarea"]]}, {"id": "loadcheck", "icon": "🚚", "title": "Laadcontrole", "desc": "Laatste laadcontrole voor vertrek", "fields": [["Datum", "date"], ["Trailer / wagen", "text"], ["Vervoerder", "text"], ["Klant", "text"], ["Sealnummer", "text"], ["CMR aanwezig", "Ja|Nee|N.v.t."], ["Aantal pallets", "number"], ["Resultaat", "Akkoord|Niet akkoord|Controle nodig"], ["Opmerking", "textarea"]]}, {"id": "returns", "icon": "↩️", "title": "Retouren PRO", "desc": "Retouren verwerken met reden en actie", "fields": [["Datum", "date"], ["Klant", "text"], ["Ordernummer", "text"], ["Artikel", "text"], ["Aantal", "number"], ["Retourreden", "Schade|Verkeerd artikel|Klant retour|Manco|Overig"], ["Actie", "Terug voorraad|Herverpakken|Vernietigen|Wachten op instructie"], ["Opmerking", "textarea"]]}, {"id": "damage", "icon": "⚠️", "title": "Schade / Manco / Extra werk", "desc": "Afwijkingen, manco’s en extra werk registreren", "fields": [["Datum", "date"], ["Type", "Schade|Manco|Extra werk"], ["Klant", "text"], ["Ordernummer", "text"], ["Barcodeinfo", "text"], ["Aantal", "number"], ["Status", "Nieuw|In behandeling|Afgerond|Wacht op klant"], ["Opmerking", "textarea"]]}, {"id": "stock_count", "icon": "📊", "title": "Voorraadtelling", "desc": "Tellingen per locatie en artikel", "fields": [["Datum", "date"], ["Teller", "text"], ["Locatie", "text"], ["Artikelnummer", "text"], ["Omschrijving", "text"], ["Verwacht aantal", "number"], ["Geteld aantal", "number"], ["Status", "OK|Verschil|Controle nodig"], ["Opmerking", "textarea"]]}, {"id": "stock_correction", "icon": "🧮", "title": "Voorraadcorrecties", "desc": "Correcties met reden en goedkeuring", "fields": [["Datum", "date"], ["Artikelnummer", "text"], ["Locatie", "text"], ["Huidige voorraad", "number"], ["Correctie", "number"], ["Reden", "Telling verschil|Schade|Manco|Boeking fout|Overig"], ["Goedgekeurd door", "text"], ["Opmerking", "textarea"]]}, {"id": "pallets", "icon": "🧱", "title": "Palletadministratie", "desc": "Euro/CHEP pallets en saldo’s", "fields": [["Datum", "date"], ["Klant / vervoerder", "text"], ["Pallettype", "Euro|CHEP|Blokpallet|Eenmalig|Overig"], ["In", "number"], ["Uit", "number"], ["Saldo / opmerking", "text"], ["Status", "Akkoord|Openstaand|Controle nodig"], ["Opmerking", "textarea"]]}, {"id": "trailer", "icon": "🚛", "title": "Trailer / container registratie", "desc": "Terreinregistratie van trailers/containers", "fields": [["Datum", "date"], ["Type", "Trailer|Container|Bakwagen"], ["Kenteken / containernummer", "text"], ["Vervoerder", "text"], ["Locatie terrein", "text"], ["Status", "Leeg|Vol|Wachten|Geladen|Gelost|Probleem"], ["Opmerking", "textarea"]]}, {"id": "visitors", "icon": "🪪", "title": "Bezoekersregistratie", "desc": "Chauffeurs, contractors en bezoekers in/uit", "fields": [["Datum", "date"], ["Naam", "text"], ["Bedrijf", "text"], ["Type bezoeker", "Chauffeur|Contractor|Bezoeker|Monteur|Overig"], ["Tijd in", "time"], ["Tijd uit", "time"], ["Badge / ID", "text"], ["Contactpersoon", "text"], ["Opmerking", "textarea"]]}, {"id": "incident", "icon": "🚨", "title": "Incident / bijna-ongeval", "desc": "Incidenten, onveilige situaties en actiepunten", "fields": [["Datum", "date"], ["Melder", "text"], ["Locatie", "text"], ["Type", "Incident|Bijna-ongeval|Schade|Letsel|Onveilige situatie"], ["Ernst", "Laag|Middel|Hoog|Kritiek"], ["Directe actie", "textarea"], ["Vervolgactie", "textarea"]]}, {"id": "equipment", "icon": "🔋", "title": "Materieel check", "desc": "Reachtruck, pompwagen, scanner, lader en defecten", "fields": [["Datum", "date"], ["Materieel", "Reachtruck|Heftruck|Pompwagen|Scanner|Lader|Overig"], ["Nummer", "text"], ["Status", "OK|Defect|Onderhoud nodig|Buiten gebruik"], ["Batterij / lading", "Vol|Half|Laag|N.v.t."], ["Defect / opmerking", "textarea"]]}, {"id": "maintenance", "icon": "🛠️", "title": "Onderhoud gebouw", "desc": "Storingen en onderhoudsmeldingen gebouw", "fields": [["Datum", "date"], ["Locatie", "text"], ["Categorie", "Lamp|Dock|Deur|Lekkage|Storing|Schade|Overig"], ["Urgentie", "Laag|Normaal|Hoog|Kritiek"], ["Status", "Nieuw|In behandeling|Afgerond"], ["Omschrijving", "textarea"]]}, {"id": "cleaning", "icon": "🧹", "title": "Schoonmaakronde", "desc": "Schoonmaakcontrole per ruimte", "fields": [["Datum", "date"], ["Ruimte", "Toiletten|Kantine|Expeditie|Dock|Buitenterrein|Hallen|Overig"], ["Status", "Schoon|Actie nodig|Niet gecontroleerd"], ["Actie uitgevoerd", "Ja|Nee|N.v.t."], ["Opmerking", "textarea"]]}, {"id": "temperature", "icon": "🌡️", "title": "Temperatuurregistratie", "desc": "Temperatuurmetingen per ruimte/zone", "fields": [["Datum", "date"], ["Ruimte / zone", "text"], ["Temperatuur °C", "number"], ["Controleur", "text"], ["Status", "OK|Afwijking|Controle nodig"], ["Opmerking", "textarea"]]}, {"id": "key_assets", "icon": "🔑", "title": "Sleutel & uitgiftebeheer", "desc": "Scanners, sleutels, tablets, portofoons en badges", "fields": [["Datum", "date"], ["Item", "Scanner|Sleutel|Tablet|Portofoon|Badge|Overig"], ["Nummer / code", "text"], ["Uitgegeven aan", "text"], ["Tijd uit", "time"], ["Tijd retour", "time"], ["Status", "Uitgegeven|Retour|Vermist|Defect"], ["Opmerking", "textarea"]]}, {"id": "contractor", "icon": "🧰", "title": "Werkvergunning / contractor check", "desc": "Externe werkzaamheden en veiligheidscheck", "fields": [["Datum", "date"], ["Bedrijf", "text"], ["Contactpersoon", "text"], ["Werkzaamheden", "textarea"], ["Locatie", "text"], ["PBM akkoord", "Ja|Nee"], ["Vrijgegeven door", "text"], ["Status", "Gepland|Bezig|Afgerond|Stopgezet"], ["Opmerking", "textarea"]]}, {"id": "photo_audit", "icon": "📸", "title": "Foto audit module", "desc": "Foto-audit per locatie met opmerkingen", "fields": [["Datum", "date"], ["Locatie", "text"], ["Categorie", "Goed voorbeeld|Afwijking|Schade|Schoonmaak|Veiligheid|Overig"], ["Opmerking", "textarea"]]}, {"id": "documents", "icon": "📄", "title": "Documentenmodule", "desc": "CMR, pakbon, POD en documentstatus", "fields": [["Datum", "date"], ["Documenttype", "CMR|Pakbon|POD|Factuur|Foto|Overig"], ["Klant", "text"], ["Ordernummer", "text"], ["Status", "Aanwezig|Ontbreekt|Controle nodig|Verzonden"], ["Opmerking", "textarea"]]}, {"id": "scan_history", "icon": "🔎", "title": "Scan geschiedenis", "desc": "Logboek voor scans en wijzigingen", "fields": [["Datum", "date"], ["Gebruiker", "text"], ["Scanwaarde", "text"], ["Module", "text"], ["Actie", "Toegevoegd|Gecontroleerd|Verwijderd|Gewijzigd"], ["Opmerking", "textarea"]]}, {"id": "templates", "icon": "💬", "title": "Klantmelding templates", "desc": "Standaard WhatsApp/mail berichten", "fields": [["Type melding", "Zending staat klaar|Schade|Manco|Vertraging|Wacht op instructie|Retour|Overig"], ["Klant", "text"], ["Zendingnummer", "text"], ["Referentie", "text"], ["Bericht", "textarea"], ["Interne opmerking", "textarea"]]}];const state={};modules.forEach(m=>state[m.id]=JSON.parse(localStorage.getItem('awc_ops_v2_'+m.id)||'[]'));
function field(mid,f,i){let id=mid+'_'+i,type=f[1];if(type==='textarea')return `<div><label>${f[0]}</label><textarea id="${id}"></textarea></div>`;if(type==='date'||type==='time'||type==='number'||type==='text')return `<div><label>${f[0]}</label><input id="${id}" type="${type}"></div>`;return `<div><label>${f[0]}</label><select id="${id}">${type.split('|').map(o=>`<option>${o}</option>`).join('')}</select></div>`}
function init(){renderNav();renderTabs();modules.forEach(m=>{if(m.id!=='dashboard'){setDates(m.id);renderList(m.id)}});show('dashboard')}
function renderNav(){let q=(document.getElementById('q')?.value||'').toLowerCase();nav.innerHTML=modules.filter(m=>m.id!=='dashboard'&&(m.title.toLowerCase().includes(q)||m.desc.toLowerCase().includes(q))).map(m=>`<button id="nav_${m.id}" onclick="show('${m.id}')">${m.icon} ${m.title}<br><span class="muted">${m.desc}</span></button>`).join('')}
function renderTabs(){tabs.innerHTML=modules.map(m=>m.id==='dashboard'?`<section id="dashboard" class="tab"><div class="card"><h2>🏠 Dashboard</h2><div id="stats" class="stats"></div></div><div class="card"><h3>Laatste registraties</h3><div id="latest"></div></div></section>`:`<section id="${m.id}" class="tab"><div class="card"><h2>${m.icon} ${m.title}</h2><p class="muted">${m.desc}</p>${m.filters?`<label>Export keuze</label><select id="${m.id}_filter" onchange="renderList('${m.id}')">${m.filters.map(x=>`<option>${x}</option>`).join('')}</select><br><br>`:''}<div class="grid">${m.fields.map((f,i)=>field(m.id,f,i)).join('')}</div><div class="btns"><button class="primary" onclick="addItem('${m.id}')">Toevoegen</button><button class="light" onclick="clearForm('${m.id}')">Formulier leeg</button><button class="red" onclick="clearModule('${m.id}')">Lijst leeg</button></div></div><div class="card"><h3>📋 Lijst</h3><div id="list_${m.id}"></div></div><div class="card"><h3>📤 Export</h3><div id="prev_${m.id}" class="preview"></div><div class="btns"><button class="green" onclick="wa('${m.id}')">WhatsApp</button><button onclick="mail('${m.id}')">Mail</button><button onclick="pdf('${m.id}')">PDF</button><button onclick="excel('${m.id}')">Excel</button><button class="light" onclick="copyText('${m.id}')">Kopieer</button></div></div></section>`).join('')}
function show(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');let b=document.getElementById('nav_'+id);if(b)b.classList.add('active');if(id==='dashboard')dashboard()}
function mod(id){return modules.find(m=>m.id===id)}function setDates(id){document.querySelectorAll('#'+id+' input[type=date]').forEach(x=>{if(!x.value)x.value=new Date().toISOString().slice(0,10)})}
function addItem(id){let m=mod(id),o={id:Date.now(),time:new Date().toLocaleString('nl-NL')};m.fields.forEach((f,i)=>o[f[0]]=document.getElementById(id+'_'+i).value);state[id].unshift(o);localStorage.setItem('awc_ops_v2_'+id,JSON.stringify(state[id]));clearForm(id);renderList(id)}
function clearForm(id){mod(id).fields.forEach((f,i)=>{let el=document.getElementById(id+'_'+i);if(el.type==='date')el.value=new Date().toISOString().slice(0,10);else if(el.tagName==='SELECT')el.selectedIndex=0;else el.value=''})}
function clearModule(id){if(confirm('Deze module leegmaken?')){state[id]=[];localStorage.setItem('awc_ops_v2_'+id,'[]');renderList(id)}}function removeItem(id,i){state[id].splice(i,1);localStorage.setItem('awc_ops_v2_'+id,JSON.stringify(state[id]));renderList(id)}
function itemTitle(o){return Object.keys(o).filter(k=>!['id','time'].includes(k)).map(k=>o[k]).find(Boolean)||'Item'}
function filtered(id){let a=[...state[id]];if(id==='personnel'){let f=document.getElementById('personnel_filter')?.value||'';if(f.includes('Afwezig'))a=a.filter(x=>['Afwezig','Ziek','Verlof','Te laat'].includes(x.Status));if(f.includes('Planning'))a=a.filter(x=>x['Werkplek / afdeling'])}return a}
function text(id){let m=mod(id),a=filtered(id);if(!a.length)return 'Geen gegevens.';let out='AWC - '+m.title+'\n\n';if(id==='personnel'&&(document.getElementById('personnel_filter')?.value||'').includes('Planning')){let g={};a.forEach(x=>{let w=x['Werkplek / afdeling']||'Onbekend';(g[w]=g[w]||[]).push(x.Medewerker||itemTitle(x))});Object.keys(g).forEach(w=>{out+=w+'\n';g[w].forEach(n=>out+='• '+n+'\n');out+='\n'});return out.trim()}a.forEach((o,i)=>{out+=(i+1)+'. '+itemTitle(o)+'\n';Object.keys(o).forEach(k=>{if(!['id','time'].includes(k)&&o[k])out+=k+': '+o[k]+'\n'});out+='Tijd: '+o.time+'\n\n'});return out.trim()}
function renderList(id){let a=filtered(id);document.getElementById('list_'+id).innerHTML=a.length?a.map(o=>`<div class="item"><div><b>${itemTitle(o)}</b><br><span class="muted">${o.time}</span></div><button class="red" onclick="removeItem('${id}',${state[id].indexOf(o)})">×</button></div>`).join(''):'<p class="muted">Nog geen gegevens.</p>';document.getElementById('prev_'+id).textContent=text(id)}
function wa(id){open('https://wa.me/?text='+encodeURIComponent(text(id)),'_blank')}function mail(id){location.href='mailto:?subject='+encodeURIComponent('AWC '+mod(id).title)+'&body='+encodeURIComponent(text(id))}function copyText(id){navigator.clipboard?.writeText(text(id)).then(()=>alert('Gekopieerd')).catch(()=>alert(text(id)))}
function pdf(id){let d=new jspdf.jsPDF();d.setFontSize(16);d.text('AWC - '+mod(id).title,14,18);d.setFontSize(10);let y=30;text(id).split('\n').forEach(l=>{if(y>280){d.addPage();y=15}d.text(l,14,y,{maxWidth:180});y+=5});d.save('AWC-'+mod(id).title.replaceAll(' ','-')+'.pdf')}
function excel(id){let ws=XLSX.utils.json_to_sheet(filtered(id)),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,mod(id).title.slice(0,30));XLSX.writeFile(wb,'AWC-'+mod(id).title.replaceAll(' ','-')+'.xlsx')}
function dashboard(){stats.innerHTML=modules.filter(m=>m.id!=='dashboard').map(m=>`<div class="stat"><b>${state[m.id].length}</b><span>${m.title}</span></div>`).join('');let all=[];modules.forEach(m=>{if(m.id!=='dashboard')state[m.id].slice(0,2).forEach(x=>all.push({m,x}))});all.sort((a,b)=>b.x.id-a.x.id);latest.innerHTML=all.slice(0,15).map(a=>`<div class="item"><div><b>${a.m.icon} ${a.m.title}</b><br>${itemTitle(a.x)}<br><span class="muted">${a.x.time}</span></div></div>`).join('')||'<p class="muted">Nog geen registraties.</p>'}
function clearAllData(){if(confirm('Alle testdata wissen?')){modules.forEach(m=>{state[m.id]=[];localStorage.setItem('awc_ops_v2_'+m.id,'[]')});modules.forEach(m=>{if(m.id!=='dashboard')renderList(m.id)});dashboard()}}
init();
</script></body></html>

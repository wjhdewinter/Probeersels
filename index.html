<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWC Operations App V2 Prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--o:#f58220;--d:#111827;--l:#e5e7eb;--b:#f6f7f9;--m:#6b7280;--g:#198754;--r:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:Arial,Helvetica,sans-serif;color:var(--d)}
header{background:#fff;border-bottom:1px solid var(--l);padding:16px;position:sticky;top:0;z-index:10}
h1{font-size:20px;margin:0}p{color:var(--m);font-size:13px}.top{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
main{max-width:1180px;margin:auto;padding:14px}.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}
button{border:0;border-radius:12px;background:#111;color:#fff;font-weight:900;padding:10px 13px}.nav button{background:#fff;color:#111;border:1px solid var(--l);text-align:left}.nav button.active{background:var(--o);color:#fff}
.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.tab{display:none}.tab.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{font-size:13px;font-weight:900;display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--l);border-radius:12px;padding:10px;font-size:15px}textarea{min-height:84px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:var(--o)}.green{background:var(--g)}.red{background:var(--r)}.light{background:#f3f4f6;color:#111;border:1px solid var(--l)}
.item{border:1px solid var(--l);border-radius:14px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:8px;background:#fff}.muted{color:var(--m);font-size:13px}.tag{display:inline-flex;border-radius:999px;padding:4px 8px;background:#fff3cd;color:#856404;font-size:11px;font-weight:900;margin-top:4px}
.preview{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--l);border-radius:14px;padding:12px;font-family:monospace;font-size:13px;max-height:330px;overflow:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{border:1px solid var(--l);border-radius:16px;padding:12px;text-align:center}.stat b{font-size:26px;color:var(--o);display:block}.files img{width:80px;height:80px;object-fit:cover;border-radius:12px;border:1px solid var(--l);margin:4px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🚀 AWC Operations App V2 Prototype</h1><p>Tweede losse test-app met brede warehouse modules.</p><div class="top"><input id="q" placeholder="Zoek module..." oninput="renderNav()"><button class="light" onclick="show('dashboard')">Dashboard</button><button class="red" onclick="clearAllData()">Alle testdata wissen</button></div></header>
<main><div class="nav" id="nav"></div><div id="tabs"></div></main>
<script>
let modules=[],state={},photos={};
fetch('modules.json').then(r=>r.json()).then(m=>{modules=m;modules.forEach(x=>state[x[0]]=JSON.parse(localStorage.getItem('awc_ops_'+x[0])||'[]'));init()}).catch(e=>document.body.innerHTML='<main><h1>Kon modules.json niet laden</h1><p>Open via GitHub Pages of lokale server.</p></main>');
function fparts(s){let p=s.split('|');return{label:p[0],type:p[1]||'text'}}
function field(mid,s,i){let f=fparts(s),id=mid+'_'+i;if(f.type==='textarea')return `<div><label>${f.label}</label><textarea id="${id}"></textarea></div>`;if(f.type==='file')return `<div><label>${f.label}</label><input id="${id}" type="file" accept="image/*,.pdf" multiple onchange="handleFiles('${id}',event)"><div class="files" id="${id}_prev"></div></div>`;if(f.type.includes(','))return `<div><label>${f.label}</label><select id="${id}">${f.type.split(',').map(o=>`<option>${o}</option>`).join('')}</select></div>`;return `<div><label>${f.label}</label><input id="${id}" type="${f.type}"></div>`}
function init(){renderNav();renderTabs();modules.forEach(m=>{setDates(m[0]);if(m[0]!=='dashboard')renderList(m[0])});show('dashboard')}
function renderNav(){let q=(document.getElementById('q')?.value||'').toLowerCase();nav.innerHTML=modules.filter(m=>m[0]!=='dashboard'&&(m[2].toLowerCase().includes(q)||m[3].toLowerCase().includes(q))).map(m=>`<button id="nav_${m[0]}" onclick="show('${m[0]}')">${m[1]} ${m[2]}<br><span class="muted">${m[3]}</span></button>`).join('')}
function renderTabs(){tabs.innerHTML=modules.map(m=>m[0]==='dashboard'?`<section id="dashboard" class="tab"><div class="card"><h2>🏠 Dashboard</h2><div class="stats" id="stats"></div></div><div class="card"><h3>Laatste registraties</h3><div id="latest"></div></div></section>`:`<section id="${m[0]}" class="tab"><div class="card"><h2>${m[1]} ${m[2]}</h2><p>${m[3]}</p>${m[0]==='personnel'?'<label>Export keuze</label><select id="personnel_filter" onchange="renderList(\\'personnel\\')"><option>Volledige lijst</option><option>Alleen afwezigen</option><option>Planning / werkplekoverzicht</option></select><br><br>':''}<div class="grid">${m[4].map((x,i)=>field(m[0],x,i)).join('')}</div><div class="btns"><button class="primary" onclick="addItem('${m[0]}')">Toevoegen</button><button class="light" onclick="clearForm('${m[0]}')">Formulier leeg</button><button class="red" onclick="clearModule('${m[0]}')">Lijst leeg</button></div></div><div class="card"><h3>📋 Lijst</h3><div id="list_${m[0]}"></div></div><div class="card"><h3>📤 Export</h3><div class="preview" id="prev_${m[0]}"></div><div class="btns"><button class="green" onclick="wa('${m[0]}')">WhatsApp</button><button onclick="mail('${m[0]}')">Mail</button><button onclick="pdf('${m[0]}')">PDF</button><button onclick="excel('${m[0]}')">Excel</button><button class="light" onclick="copy('${m[0]}')">Kopieer</button></div></div></section>`).join('')}
function show(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');let b=document.getElementById('nav_'+id);if(b)b.classList.add('active');if(id==='dashboard')dashboard()}
function mod(id){return modules.find(m=>m[0]===id)}function setDates(id){document.querySelectorAll('#'+id+' input[type=date]').forEach(x=>{if(!x.value)x.value=new Date().toISOString().slice(0,10)})}
function handleFiles(id,e){photos[id]=[];[...e.target.files].slice(0,4).forEach(file=>{let r=new FileReader();r.onload=ev=>{photos[id].push(file.name);let p=document.getElementById(id+'_prev');if(file.type.startsWith('image'))p.innerHTML+=`<img src="${ev.target.result}">`};r.readAsDataURL(file)})}
function addItem(id){let m=mod(id),o={id:Date.now(),time:new Date().toLocaleString('nl-NL')};m[4].forEach((ff,i)=>{let fp=fparts(ff),el=document.getElementById(id+'_'+i);o[fp.label]=el.type==='file'?(photos[id+'_'+i]||[]).join(', '):el.value});state[id].unshift(o);localStorage.setItem('awc_ops_'+id,JSON.stringify(state[id]));clearForm(id);renderList(id)}
function clearForm(id){mod(id)[4].forEach((ff,i)=>{let el=document.getElementById(id+'_'+i);if(el.type==='date')el.value=new Date().toISOString().slice(0,10);else if(el.type==='file'){el.value='';photos[id+'_'+i]=[];let p=document.getElementById(id+'_'+i+'_prev');if(p)p.innerHTML=''}else if(el.tagName==='SELECT')el.selectedIndex=0;else el.value=''})}
function clearModule(id){if(confirm('Deze module leegmaken?')){state[id]=[];localStorage.setItem('awc_ops_'+id,'[]');renderList(id)}}function removeItem(id,i){state[id].splice(i,1);localStorage.setItem('awc_ops_'+id,JSON.stringify(state[id]));renderList(id)}
function title(o){return Object.keys(o).filter(k=>!['id','time'].includes(k)).map(k=>o[k]).find(Boolean)||'Item'}
function filtered(id){let a=[...state[id]];if(id==='personnel'){let f=document.getElementById('personnel_filter')?.value||'';if(f.includes('Afwezig'))a=a.filter(x=>['Afwezig','Ziek','Verlof','Te laat'].includes(x.Status));if(f.includes('Planning'))a=a.filter(x=>x['Werkplek / afdeling'])}return a}
function text(id){let m=mod(id),a=filtered(id);if(!a.length)return 'Geen gegevens.';let out='AWC - '+m[2]+'\n\n';if(id==='personnel'&&(document.getElementById('personnel_filter')?.value||'').includes('Planning')){let g={};a.forEach(x=>{let w=x['Werkplek / afdeling']||'Onbekend';(g[w]=g[w]||[]).push(x.Medewerker||title(x))});Object.keys(g).forEach(w=>{out+=w+'\n';g[w].forEach(n=>out+='• '+n+'\n');out+='\n'});return out.trim()}a.forEach((o,i)=>{out+=(i+1)+'. '+title(o)+'\n';Object.keys(o).forEach(k=>{if(!['id','time'].includes(k)&&o[k])out+=k+': '+o[k]+'\n'});out+='Tijd: '+o.time+'\n\n'});return out.trim()}
function renderList(id){let a=filtered(id);document.getElementById('list_'+id).innerHTML=a.length?a.map(o=>`<div class="item"><div><b>${title(o)}</b><br><span class="muted">${o.time}</span><br><span class="tag">${mod(id)[2]}</span></div><button class="red" onclick="removeItem('${id}',${state[id].indexOf(o)})">×</button></div>`).join(''):'<p class="muted">Nog geen gegevens.</p>';document.getElementById('prev_'+id).textContent=text(id)}
function wa(id){open('https://wa.me/?text='+encodeURIComponent(text(id)),'_blank')}function mail(id){location.href='mailto:?subject='+encodeURIComponent('AWC '+mod(id)[2])+'&body='+encodeURIComponent(text(id))}function copy(id){navigator.clipboard?.writeText(text(id)).then(()=>alert('Gekopieerd')).catch(()=>alert(text(id)))}
function pdf(id){let d=new jspdf.jsPDF();d.setFontSize(16);d.text('AWC - '+mod(id)[2],14,18);d.setFontSize(10);let y=30;text(id).split('\n').forEach(l=>{if(y>280){d.addPage();y=15}d.text(l,14,y,{maxWidth:180});y+=5});d.save('AWC-'+mod(id)[2].replaceAll(' ','-')+'.pdf')}
function excel(id){let ws=XLSX.utils.json_to_sheet(filtered(id)),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,mod(id)[2].slice(0,30));XLSX.writeFile(wb,'AWC-'+mod(id)[2].replaceAll(' ','-')+'.xlsx')}
function dashboard(){stats.innerHTML=modules.filter(m=>m[0]!=='dashboard').map(m=>`<div class="stat"><b>${state[m[0]].length}</b><span>${m[2]}</span></div>`).join('');let all=[];modules.forEach(m=>{if(m[0]!=='dashboard')state[m[0]].slice(0,2).forEach(x=>all.push({m,x}))});all.sort((a,b)=>b.x.id-a.x.id);latest.innerHTML=all.slice(0,15).map(a=>`<div class="item"><div><b>${a.m[1]} ${a.m[2]}</b><br>${title(a.x)}<br><span class="muted">${a.x.time}</span></div></div>`).join('')||'<p class="muted">Nog geen registraties.</p>'}
function clearAllData(){if(confirm('Alle testdata wissen?')){modules.forEach(m=>{state[m[0]]=[];localStorage.setItem('awc_ops_'+m[0],'[]')});modules.forEach(m=>{if(m[0]!=='dashboard')renderList(m[0])});dashboard()}}
</script></body></html>
